<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Survey - SurveyPro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: rgba(84, 60, 174, 0.05);
            color: #2d1846;
            line-height: 1.6;
        }

        .nav {
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            box-shadow: 0 2px 4px rgba(84, 60, 174, 0.1);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-button {
            padding: 8px 16px;
            background: transparent;
            border: 2px solid rgb(84, 60, 174);
            border-radius: 5px;
            color: rgb(84, 60, 174);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-button:hover {
            background: rgba(84, 60, 174, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: rgb(84, 60, 174);
            text-decoration: none;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 4px rgba(84, 60, 174, 0.1);
        }

        .survey-header input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid rgba(84, 60, 174, 0.3);
            border-radius: 5px;
            font-size: 16px;
        }

        .survey-header input:focus {
            outline: none;
            border-color: rgb(84, 60, 174);
        }

        .add-question {
            margin: 20px 0;
            padding: 20px;
            background: rgba(84, 60, 174, 0.05);
            border-radius: 5px;
        }

        .question-type {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid rgba(84, 60, 174, 0.3);
            border-radius: 5px;
        }

        .button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .primary-button {
            background: rgb(84, 60, 174);
            color: white;
        }

        .primary-button:hover {
            background: rgb(64, 45, 134);
        }

        .secondary-button {
            background: white;
            border: 2px solid rgb(84, 60, 174);
            color: rgb(84, 60, 174);
        }

        .secondary-button:hover {
            background: rgba(84, 60, 174, 0.1);
        }

        .questions-list {
            margin: 20px 0;
        }

        .question-item {
            padding: 20px;
            margin: 10px 0;
            border: 1px solid rgba(84, 60, 174, 0.3);
            border-radius: 5px;
            position: relative;
        }

        .question-actions {
            position: absolute;
            right: 10px;
            top: 10px;
        }

        

        .options-container {
            margin-top: 10px;
        }

        .option-input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid rgba(84, 60, 174, 0.3);
            border-radius: 3px;
        }

        .add-option-btn {
            margin-top: 10px;
            background: rgba(84, 60, 174, 0.1);
            color: rgb(84, 60, 174);
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .preview {
            margin-top: 20px;
            padding: 20px;
            background: rgba(84, 60, 174, 0.05);
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <nav class="nav">
        <a href="index.html" class="logo">SurveyPro</a>

        <div class="nav-left">
            <a href="index.html"><button  class="back-button">← Back</button></a>
        </div>

    </nav>

    <div class="container">
        <div class="survey-header">
            <input type="text" id="surveyTitle" placeholder="Enter survey title">
            <input type="text" id="surveyDescription" placeholder="Enter survey description">
        </div>

        <div class="add-question">
            <h3>Add New Question</h3>
            <select id="questionType" class="question-type">
                <option value="multiple">Multiple Choice</option>
                <option value="text">Text Input</option>
                <option value="rating">Rating Scale</option>
            </select>
            <input type="text" id="questionText" class="question-type" placeholder="Enter your question">
            <button onclick="addQuestion()" class="button primary-button">Add Question</button>
        </div>

        <div id="questionsList" class="questions-list">

        </div>

        <div class="actions">
            <button onclick="previewSurvey()" class="button secondary-button">Preview Survey</button>
            <button onclick="saveSurvey()" class="button primary-button">Save Survey</button>
        </div>

        <div id="preview" class="preview" style="display: none;">


        </div>
    </div>

    <script>
        let questions = [];
        let questionCounter = 0;

        function addQuestion() {
            const questionType = document.getElementById('questionType').value;
            const questionText = document.getElementById('questionText').value;
            
            if (!questionText) {
                alert('Please enter a question');
                return;
            }

            questionCounter++;
            const questionId = `question-${questionCounter}`;

            const question = {
                id: questionId,
                type: questionType,
                text: questionText,
                options: []
            };

            questions.push(question);
            displayQuestion(question);
            document.getElementById('questionText').value = '';
        }

        function displayQuestion(question) {
            const questionsDiv = document.getElementById('questionsList');
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-item';
            questionDiv.id = question.id;

            let optionsHtml = '';
            if (question.type === 'multiple') {
                optionsHtml = `
                    <div class="options-container">
                        <input type="text" class="option-input" placeholder="Option 1">
                        <input type="text" class="option-input" placeholder="Option 2">
                        <input type="text" class="option-input" placeholder="Option 3">
                        <button onclick="addOption('${question.id}')" class="add-option-btn">Add Option</button>
                    </div>
                `;
            } else if (question.type === 'rating') {
                optionsHtml = `
                    <div class="options-container">
                        Scale: 1-5 ⭐
                    </div>
                `;
            }

            questionDiv.innerHTML = `
                
                <h3>Q${questionCounter}. ${question.text}</h3>
                <p>Type: ${question.type}</p>
                ${optionsHtml}
            `;

            questionsDiv.appendChild(questionDiv);
        }

        

        function addOption(questionId) {
            const questionDiv = document.getElementById(questionId);
            const optionsContainer = questionDiv.querySelector('.options-container');
            const newOption = document.createElement('input');
            newOption.type = 'text';
            newOption.className = 'option-input';
            newOption.placeholder = `Option ${optionsContainer.querySelectorAll('.option-input').length + 1}`;
            optionsContainer.insertBefore(newOption, optionsContainer.lastElementChild);
        }

        function previewSurvey() {
            const previewDiv = document.getElementById('preview');
            const title = document.getElementById('surveyTitle').value;
            const description = document.getElementById('surveyDescription').value;

            let previewHtml = `
                <h2>${title || 'Untitled Survey'}</h2>
                <p>${description || 'No description'}</p>
                <hr>
            `;

            questions.forEach((q, index) => {
                previewHtml += `<div class="question-item">
                    <h3>Q${index + 1}. ${q.text}</h3>`;

                if (q.type === 'multiple') {
                    const options = document.getElementById(q.id).querySelectorAll('.option-input');
                    options.forEach(option => {
                        if (option.value) {
                            previewHtml += `
                                <div>
                                    <input type="radio" name="q${index}"> ${option.value}
                                </div>
                            `;
                        }
                    });
                } else if (q.type === 'text') {
                    previewHtml += `<input type="text" placeholder="Enter your answer" style="width: 100%; padding: 8px;">`;
                } else if (q.type === 'rating') {
                    previewHtml += `
                        <div>
                            1 ⭐ 2 ⭐ 3 ⭐ 4 ⭐ 5 ⭐
                        </div>
                    `;
                }

                previewHtml += '</div>';
            });

            previewDiv.innerHTML = previewHtml;
            previewDiv.style.display = 'block';
        }

        function saveSurvey() {
            const surveyData = {
                title: document.getElementById('surveyTitle').value,
                description: document.getElementById('surveyDescription').value,
                questions: questions
            };

            
            alert('Survey saved successfully!');
            console.log('Survey Data:', surveyData);
        }
    </script>
</body>

</html>
