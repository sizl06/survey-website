<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback Survey - SurveyPro</title>
    <link rel="stylesheet" href="./CSS/survey1.css">
</head>

<body>
    <nav class="nav">
        <a href="#" class="logo">SurveyPro</a>
    </nav>

    <div class="survey-container">
        <div class="survey-header">
            <h1 class="survey-title">Customer Feedback Survey</h1>
            <p class="survey-description">Help us improve our products and services by sharing your experience.</p>
        </div>

        <form>
            <div class="question-group">
                <label class="question">Name<span class="required">*</span></label>
                <input type="text" required placeholder="Enter your full name">
            </div>

            <div class="question-group">
                <label class="question">Email<span class="required">*</span></label>
                <input type="email" required placeholder="Enter your email address">
            </div>

            <div class="rating-group">
                <div class="rating-option">
                    <input type="radio" name="satisfaction" id="rating1" value="1" class="rating-input">
                    <label for="rating1" class="rating-number">1</label>
                    <div class="rating-label">Very Dissatisfied</div>
                </div>
                <div class="rating-option">
                    <input type="radio" name="satisfaction" id="rating2" value="2" class="rating-input">
                    <label for="rating2" class="rating-number">2</label>
                    <div class="rating-label">Dissatisfied</div>
                </div>
                <div class="rating-option">
                    <input type="radio" name="satisfaction" id="rating3" value="3" class="rating-input">
                    <label for="rating3" class="rating-number">3</label>
                    <div class="rating-label">Neutral</div>
                </div>
                <div class="rating-option">
                    <input type="radio" name="satisfaction" id="rating4" value="4" class="rating-input">
                    <label for="rating4" class="rating-number">4</label>
                    <div class="rating-label">Satisfied</div>
                </div>
                <div class="rating-option">
                    <input type="radio" name="satisfaction" id="rating5" value="5" class="rating-input">
                    <label for="rating5" class="rating-number">5</label>
                    <div class="rating-label">Very Satisfied</div>
                </div>
            </div>
            <div class="question-group">
                <label class="question">Which features do you use most often?<span class="required">*</span></label>
                <div class="checkbox-group">
                    <label class="checkbox-option">
                        <input type="checkbox" name="features" value="analytics">
                        Analytics Dashboard
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" name="features" value="reports">
                        Custom Reports
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" name="features" value="templates">
                        Survey Templates
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" name="features" value="sharing">
                        Survey Sharing
                    </label>
                </div>
            </div>

            <div class="question-group">
                <label class="question">How likely are you to recommend our product to others?<span
                        class="required">*</span></label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="recommend" value="very-likely">
                        Very Likely
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="recommend" value="likely">
                        Likely
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="recommend" value="neutral">
                        Neutral
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="recommend" value="unlikely">
                        Unlikely
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="recommend" value="very-unlikely">
                        Very Unlikely
                    </label>
                </div>
            </div>

            <div class="question-group">
                <label class="question">What improvements would you like to see?</label>
                <textarea rows="4" placeholder="Share your suggestions..."></textarea>
            </div>

            <button type="submit" class="submit-btn"><a href="./index.html" style="text-decoration: none; color: white;">Submit Feedback</a></button>
        </form>
    </div>
</body>

</html>
